# A database for gallery development only (`npm run dev` on the same
# machine): PostgreSQL with pgvector on a loopback port, data in a named
# Docker volume. An install uses compose.yaml instead. Credentials come
# from a git-ignored .env.db beside this file (see .env.db.example).
#
#   docker compose --env-file .env.db -f compose.db.yaml up -d
#   docker compose --env-file .env.db -f compose.db.yaml down        # keeps the volume
#   docker compose --env-file .env.db -f compose.db.yaml down -v     # deletes the data
services:
  db:
    # The same image, at the same digest, as compose.yaml's database
    # (docs/BUILDING.md, "The database version"). Until 2026-11 this file
    # used PostgreSQL 17 with a volume named hikari-db; a data folder
    # starts only on the major version that wrote it, so this one has a
    # new volume name and leaves an old 17 volume alone (moving its
    # contents over is a dump and restore).
    image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HIKARI_DB_NAME:?set in .env.db}
      POSTGRES_USER: ${HIKARI_DB_USER:?set in .env.db}
      POSTGRES_PASSWORD: ${HIKARI_DB_PASSWORD:?set in .env.db}
    ports:
      - "${HIKARI_DB_BIND:-127.0.0.1}:${HIKARI_DB_PORT:-5432}:5432"
    volumes:
      - hikari-db-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  hikari-db-18:
