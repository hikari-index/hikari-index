[package]
name = "palette-descriptor"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Deterministic colour descriptor for anime candidate stills"

[[bin]]
name = "palette-descriptor"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
png = "0.18"
