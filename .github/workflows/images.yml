name: Images

# Builds the published images (docs/RELEASING.md).
#   pull request   build only, nothing pushed: proves the images still build
#   merge to main  push `dev` and `sha-<short commit>`; skipped when the
#                  merge touches nothing an image is built from (the
#                  paths-ignore list below), so `dev` does not move, and
#                  nobody running it is offered an update, for a docs fix
#   tag vX.Y.Z     build every image under a tag of this run's own
#                  (`build-<run id>`), and only when all of them exist
#                  point `X.Y.Z` and `latest` at them, then open a draft
#                  release (a tag always builds: GitHub applies no path
#                  filter to tags)
# The GPU analyze worker is not built here: its CUDA base (about 18 GB)
# does not fit on a standard runner. The gallery (both builds) and the
# text encoder are also built for linux/arm64; the two workers are
# amd64 only (a pinned amd64 FFmpeg package, an x86-64 Rust target, and
# no arm64 CPU build of the pinned torchvision).
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    # Only when every changed file is one of these. No Dockerfile copies
    # any of them. `*.md` is the markdown at the repository root; a
    # README inside providers/ is copied into an image and still builds.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "templates/**"
      - "ca_profile.xml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One run at a time per branch or pull request. Releases share one group
# whatever their tags, so two of them never move `latest` at once.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'images-release' || format('images-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gallery
            context: gallery
            dockerfile: gallery/Dockerfile
            version_arg: HIKARI_GALLERY_VERSION
            platforms: linux/amd64,linux/arm64
          # The gallery as a viewer only (ADR-0015): no admin area, no
          # worker API, no writes; for a copy the public can reach.
          - image: gallery-readonly
            context: gallery
            dockerfile: gallery/Dockerfile
            version_arg: HIKARI_GALLERY_VERSION
            extra_args: HIKARI_READ_ONLY_BUILD=1
            platforms: linux/amd64,linux/arm64
          - image: worker
            context: .
            dockerfile: containers/worker/Dockerfile
            version_arg: HIKARI_WORKER_VERSION
          - image: cpu-worker
            context: .
            dockerfile: containers/cpu-worker/Dockerfile
            version_arg: HIKARI_WORKER_VERSION
          - image: text-encoder
            context: .
            dockerfile: containers/text-encoder/Dockerfile
            version_arg: ""
            platforms: linux/amd64,linux/arm64
    steps:
      # The CPU worker (torch, models) needs more room than a runner has
      # free by default; the preinstalled SDKs it removes are unused here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - uses: actions/checkout@v5

      # What the image reports as its version: the release number on a tag,
      # dev-<short commit> otherwise.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # arm64 builds run under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms || '', 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hikari-index/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=build-${{ github.run_id }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=hikari-index ${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.version_arg && format('{0}={1}-{2}', matrix.version_arg, matrix.image, steps.version.outputs.value) || '' }}
            ${{ matrix.extra_args || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=min

  # The all-in-one image (containers/all-in-one): the gallery, worker and
  # text encoder images' files, put together with the database. amd64
  # only, as the worker is. After the job above, which makes those images.
  all-in-one:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hikari-index/hikari-index
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=build-${{ github.run_id }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=hikari-index all-in-one
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # Where the gallery, worker and text encoder inside it come from.
      # A published all-in-one must hold exactly the files of the images
      # published beside it, so on main and on a release it is put
      # together from the images the job above just pushed (by their
      # commit tag, which never moves, or this run's own tag), never from
      # a second build of them. A pull request pushes nothing, so there
      # the three are built again from the checkout, which only proves
      # the image still builds.
      - name: Parts
        id: parts
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="build-${GITHUB_RUN_ID}"
          elif [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == refs/heads/main ]]; then
            tag="sha-${GITHUB_SHA::7}"
          else
            tag=""
          fi
          {
            echo 'set<<END_OF_SET'
            for part in gallery worker text-encoder; do
              if [[ -n "$tag" ]]; then
                echo "all-in-one.contexts.$part=docker-image://ghcr.io/hikari-index/$part:$tag"
              else
                echo "$part.cache-from=type=gha,scope=$part"
              fi
            done
            echo 'all-in-one.cache-from=type=gha,scope=all-in-one'
            echo 'all-in-one.cache-to=type=gha,scope=all-in-one,mode=min'
            echo 'END_OF_SET'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/bake-action@v6
        env:
          VERSION: ${{ steps.version.outputs.value }}
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: all-in-one
          push: ${{ github.event_name != 'pull_request' }}
          set: ${{ steps.parts.outputs.set }}

  # The one job in a release that moves a tag anyone pulls by. Every
  # image of this run exists by now under `build-<run id>`;
  # this points `X.Y.Z`, then `latest`, at those same images (a registry
  # copy of the tag, no rebuild). So a build that fails leaves `X.Y.Z` and
  # `latest` where they were for every image.
  #
  # A version tag is never overwritten. One that already points at this
  # run's image is left alone, so "Re-run failed jobs" finishes a release
  # this job was interrupted in. One that points at any other build stops
  # the job before it moves anything: that version is out, and a second
  # build of it would not be the same image. `latest` moves only when
  # this is the newest version tag in the repository, so re-running an
  # old release cannot take it backward.
  #
  # The tag copies are separate writes to the registry, not one: if this
  # job dies between two of them, some images have the new tags and some
  # do not until it is run again. Version tags all go first, so the
  # stretch in which `latest` can be mixed is the last six copies.
  publish:
    needs: [build, all-in-one]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the version and latest at this run's images
        env:
          REGISTRY: ghcr.io/hikari-index
          IMAGES: gallery gallery-readonly worker cpu-worker text-encoder hikari-index
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staged="build-${GITHUB_RUN_ID}"

          # The digest a tag points at; nothing when there is no such tag.
          # Any other failure stops the job: a tag that could not be read
          # must never be taken for a tag that is not there.
          digest() {
            local out
            if out="$(docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}' 2>&1)"; then
              printf '%s' "$out"
            elif ! printf '%s\n' "$out" | grep -q ': not found$'; then
              echo "::error::could not read $1: $out" >&2
              return 1
            fi
          }

          # 1. Every image of this run, before anything moves.
          declare -A built
          for image in $IMAGES; do
            built[$image]="$(digest "$REGISTRY/$image:$staged")"
            [ -n "${built[$image]}" ] || { echo "::error::$image:$staged is missing; nothing was published"; exit 1; }
          done

          # 2. No version tag from another build, before anything moves.
          todo=""; taken=""
          for image in $IMAGES; do
            now="$(digest "$REGISTRY/$image:$version")"
            if [ -z "$now" ]; then todo="$todo $image"
            elif [ "$now" != "${built[$image]}" ]; then taken="$taken $image"
            fi
          done
          if [ -n "$taken" ]; then
            echo "::error::$version is already published from another build for:$taken. A version tag is never overwritten, so nothing was moved. See \"When a release run fails\" in docs/RELEASING.md."
            exit 1
          fi

          # 3. The newest version tag in the repository, before anything
          # moves: failing to read it must not leave the job half done.
          newest="$(git ls-remote --tags --refs "$REPOSITORY_URL" 'refs/tags/v*' | sed -n 's|.*refs/tags/v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$|\1|p' | sort -V | tail -n 1)"
          [ -n "$newest" ] || { echo "::error::the repository has no version tag, not even $GITHUB_REF_NAME; nothing was moved"; exit 1; }

          # 4. The version.
          for image in $todo; do
            docker buildx imagetools create --tag "$REGISTRY/$image:$version" "$REGISTRY/$image@${built[$image]}"
          done

          # 5. latest, when no newer version has been tagged.
          if [ "$newest" != "$version" ]; then
            echo "::notice::latest stays where it is: $newest is tagged and is newer than $version"
            exit 0
          fi
          for image in $IMAGES; do
            docker buildx imagetools create --tag "$REGISTRY/$image:latest" "$REGISTRY/$image@${built[$image]}"
          done

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A draft: the maintainer writes the "Action needed" line on top of
      # the generated list, then publishes (docs/RELEASING.md).
      - run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag             --title "$GITHUB_REF_NAME" --generate-notes             --notes "**Action needed:** _write what to do, or None_"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
