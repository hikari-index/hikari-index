# A CPU analyze worker on a second machine (https://hikari-index.github.io/hikari-index-docs/install/second-machine/). With
# HIKARI_WORKER_STANDBY=1 in its settings it takes an analyze stage only
# while no regular analyze worker has checked in for 10 minutes, so it
# covers the hours a GPU machine is off and stays out of its way
# otherwise. It reaches the job table only through the gallery's worker
# API; the data is read-only over a network share.
#
# Settings in a git-ignored .env.cpu-worker beside this file (see
# .env.cpu-worker.example). The share is a Docker volume made once on the
# machine (it holds the share credential), named by HIKARI_SHARE_VOLUME.
#
#   docker compose --env-file .env.cpu-worker -f compose.cpu-worker.yaml build
#   docker compose --env-file .env.cpu-worker -f compose.cpu-worker.yaml up -d
#   docker compose --env-file .env.cpu-worker -f compose.cpu-worker.yaml logs -f
services:
  analyze-worker:
    build:
      context: .
      dockerfile: containers/cpu-worker/Dockerfile
      args:
        HIKARI_WORKER_VERSION: "${HIKARI_WORKER_VERSION:?set HIKARI_WORKER_VERSION in .env.cpu-worker}"
    # Built here by default. Set HIKARI_IMAGE_REPOSITORY to pull the tag
    # from a registry of yours instead of building.
    image: ${HIKARI_IMAGE_REPOSITORY:-hikari-index/cpu-worker}:${HIKARI_WORKER_VERSION:?set HIKARI_WORKER_VERSION in .env.cpu-worker}
    env_file: .env.cpu-worker
    environment:
      HIKARI_SHARE: /share
      HIKARI_DEVICE: cpu
    volumes:
      - type: volume
        source: share
        target: /share
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=4g,mode=1777
      - /home/hikari:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  share:
    external: true
    name: ${HIKARI_SHARE_VOLUME:-hikari-index-share}
